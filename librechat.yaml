version: 1.3.13
cache: true
endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['xiaomi/mimo-v2.5', 'xiaomi/mimo-v2.5-pro', 'deepseek/deepseek-v4-pro', 'deepseek/deepseek-v4-flash', 'z-ai/glm-5.2', 'tencent/hy3', 'minimax/minimax-m3', 'stepfun/step-3.7-flash', 'openai/gpt-oss-120b', 'google/gemma-4-26b-a4b-it', 'moonshotai/kimi-k2-thinking', 'moonshotai/kimi-k3', 'moonshotai/kimi-k2.7-code']
        fetch: false
      titleConvo: true
      titleModel: 'xiaomi/mimo-v2.5'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  enforce: false # Set to true if you want to block users from picking other non-spec models
  addedEndpoints:
    - anthropic # Makes the built-in Anthropic endpoint selectable alongside the specs below
    - OpenRouter # Without this, addedEndpoints acts as an allowlist and hides the custom OpenRouter endpoint entirely
  list:
    - name: "openrouter-default"
      label: "Open Router (Default)"
      description: "System-wide default model powered by OpenRouter"
      default: true # <--- This makes it the global default for all users
      group: "OpenRouter" # Nests this spec under the OpenRouter endpoint instead of duplicating a near-identical top-level entry
      preset:
        endpoint: "OpenRouter" # Matches the exact 'name' given in Step 1
        model: "xiaomi/mimo-v2.5" # The exact OpenRouter model ID

interface:
  modelSelect: true # Re-enables the endpoint/model dropdown alongside model specs
  parameters: true
  presets: true
